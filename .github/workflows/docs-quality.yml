name: Docs quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_NO_BUILD: "1"

concurrency:
  group: docs-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate repository text and Markdown structure
        run: python scripts/check_docs.py
      - name: Validate the locked research-script environment
        run: uv --no-config lock --check --script docs/project/research/data/extract_lockfile_inventory.py
      - name: Validate dependency cool-off
        run: python scripts/check_dependency_cooloff.py
      - name: Validate lockfile inventories against pinned upstream sources
        run: python scripts/check_lockfile_inventories.py
      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q scripts tests docs/project/research/data/extract_lockfile_inventory.py
          bash -n \
            .claude/hooks/tbd-closing-reminder.sh \
            .claude/scripts/ensure-gh-cli.sh \
            .claude/scripts/tbd-session.sh \
            .codex/ensure-gh-cli.sh \
            .codex/tbd-closing-reminder.sh \
            .codex/tbd-session.sh
      - name: Validate JSON files
        run: |
          while IFS= read -r file; do
            python -m json.tool "$file" >/dev/null
          done < <(git ls-files '*.json')
